name: MonitorArrange
options:
  bundleIdPrefix: com.kyungmin
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.4"

targets:
  MonitorArrange:
    type: application
    platform: macOS
    sources:
      - path: MonitorArrange
    info:
      path: MonitorArrange/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
    entitlements:
      path: MonitorArrange/Resources/MonitorArrange.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyungmin.MonitorArrange
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        INFOPLIST_FILE: MonitorArrange/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
